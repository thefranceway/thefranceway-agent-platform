name = "agent-dispatcher"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
PLATFORM_VERSION = "1.0.0"
PLATFORM_AUTHOR = "thefranceway"
BACKEND_URL = "https://api.thefranceway.com"

# PLATFORM_API_KEY is a secret, not a var — set it with:
#   wrangler secret put PLATFORM_API_KEY
# Must match the PLATFORM_API_KEY env var on the Python server.
#
# No D1 binding anymore — this Worker proxies to api_server.py's SQLite-backed
# queue (core/task_queue.py) instead of maintaining a second, disconnected
# task store. See workers/dispatcher/src/index.ts for why.
