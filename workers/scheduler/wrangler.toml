name = "agent-scheduler"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "agent_platform_db"
database_id = "2254bd61-3e66-454e-b8ee-5562ac3980e2"

[vars]
WEBHOOK_URL = "https://api.thefranceway.com/run-queue"
PLATFORM_VERSION = "1.0.0"

# PLATFORM_API_KEY is a secret, not a var — set it with:
#   wrangler secret put PLATFORM_API_KEY
# Must match the PLATFORM_API_KEY env var on the Python server, or every
# /run-queue call from this Worker gets a 401 and the task queue never drains.

# Cron triggers — polls the task queue every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Override for development:
# wrangler dev --test-scheduled
